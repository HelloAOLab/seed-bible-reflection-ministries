name: Sync Seed-Bible Develop

on:
  schedule:
    - cron: "0 4 * * *" # every minute (testing)
  workflow_dispatch:

jobs:
  sync_fork_job:
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable pnpm
        run: corepack enable

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync Fork
        run: |
          node ./script/sync-fork.mjs sync-fork \
          ${{ github.repository }} \
          HelloAOLab/seed-bible \
          -a ${{ secrets.GITHUB_TOKEN }} \
          -s ${{ secrets.GITHUB_TOKEN }}
