name: Sync Seed-Bible Develop

on:
  schedule:
    - cron: "55 4 * * *"
  workflow_dispatch:

jobs:
  sync_fork_job:
    name: Sync Reflection with Seed-Bible
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "pnpm" # enables pnpm caching

      - name: Install Dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Sync Fork
        run: |
          node ./script/sync-fork.mjs sync-fork \
          ${{ github.repository }} \
          HelloAOLab/seed-bible \
          -a ${{ secrets.GITHUB_TOKEN }} \
          -s ${{ secrets.GITHUB_TOKEN }}
